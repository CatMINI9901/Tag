<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D PPAP</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 18px; pointer-events: none; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #hp-bar-container { width: 200px; height: 10px; background: rgba(255,255,255,0.3); margin-top: 5px; border: 2px solid #fff; }
        #hp-bar { width: 100%; height: 100%; background: #ff4444; transition: width 0.2s; }
        #msg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; font-size: 30px; text-align: center; cursor: pointer;
            background: rgba(135, 206, 235, 0.8); z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span><br>
        HEALTH
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
        <div style="font-size: 12px; color: #eee; margin-top: 5px;">SPACE: JUMP | W,A,S,D: MOVE</div>
    </div>
    <div id="msg" onclick="startGame()">
        <div id="title-text">CLICK TO START</div>
        <div style="font-size: 14px; margin-top: 20px; color: #555;">青空のドローン討伐任務</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0, hp = 100, isStarted = false;
        let invincibleUntil = 0;
        const enemies = [], playerBullets = [], enemyBullets = [], walls = [];
        const keys = {};

        let playerVelocityY = 0;
        const gravity = -0.01;
        const jumpStrength = 0.22;
        let canJump = false;

        const scene = new THREE.Scene();
        // --- 昼の設定 ---
        scene.background = new THREE.Color(0x87ceeb); // スカイブルー
        scene.fog = new THREE.Fog(0x87ceeb, 20, 100); // 遠くを霞ませる

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- ライティングの調整 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // 地面（芝生風）
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshPhongMaterial({ color: 0x448844 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        
        const grid = new THREE.GridHelper(200, 50, 0x336633, 0x559955);
        grid.position.y = 0.01;
        scene.add(grid);

        // 壁（コンクリート風）
        const wallGeo = new THREE.BoxGeometry(4, 10, 4);
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x999999 });
        for(let i=0; i<15; i++) {
            const w = new THREE.Mesh(wallGeo, wallMat);
            const a = Math.random() * Math.PI * 2;
            const d = 20 + Math.random() * 20;
            w.position.set(Math.cos(a)*d, 5, Math.sin(a)*d);
            scene.add(w); walls.push(w);
        }

        const player = new THREE.Group();
        player.position.set(0, 1.6, 0);
        scene.add(player);
        player.add(camera);

        const msg = document.getElementById('msg');

        function createDrone() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.SphereGeometry(0.5, 8, 8),
                new THREE.MeshPhongMaterial({ color: 0x333333, shininess: 100 })
            );
            group.add(body);

            const wingGeo = new THREE.BoxGeometry(0.8, 0.1, 0.3);
            const wingMat = new THREE.MeshPhongMaterial({ color: 0xffffff });
            const leftWing = new THREE.Mesh(wingGeo, wingMat);
            leftWing.position.set(-0.7, 0, 0);
            group.add(leftWing);
            const rightWing = new THREE.Mesh(wingGeo, wingMat);
            rightWing.position.set(0.7, 0, 0);
            group.add(rightWing);

            return group;
        }

        window.startGame = function() {
            hp = 100; score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('hp-bar').style.width = '100%';
            
            enemies.forEach(e => scene.remove(e));
            playerBullets.forEach(b => scene.remove(b));
            enemyBullets.forEach(b => scene.remove(b));
            enemies.length = 0; playerBullets.length = 0; enemyBullets.length = 0;

            player.position.set(0, 1.6, 0);
            playerVelocityY = 0;

            for(let i=0; i<6; i++) spawnEnemy();
            isStarted = true;
            renderer.domElement.requestPointerLock();
        }

        function spawnEnemy() {
            const drone = createDrone();
            const a = Math.random() * Math.PI * 2;
            const d = 25 + Math.random() * 20;
            drone.position.set(Math.cos(a)*d, 2.0, Math.sin(a)*d);
            drone.lastShootTime = Date.now() + Math.random() * 2000;
            scene.add(drone);
            enemies.push(drone);
        }

        document.addEventListener('pointerlockchange', () => {
            msg.style.display = document.pointerLockElement === renderer.domElement ? 'none' : 'flex';
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            }
        });
        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);

        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement === renderer.domElement && isStarted) {
                // 弾をレーザーっぽく黄色に変更
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({color: 0xffcc00}));
                const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
                b.position.copy(player.position);
                b.velocity = dir.multiplyScalar(1.5);
                scene.add(b); playerBullets.push(b);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isStarted || document.pointerLockElement !== renderer.domElement) {
                renderer.render(scene, camera);
                return;
            }

            const now = Date.now();

            playerVelocityY += gravity;
            player.position.y += playerVelocityY;
            if (player.position.y <= 1.6) {
                player.position.y = 1.6;
                playerVelocityY = 0;
                canJump = true;
            }
            if (keys['Space'] && canJump) {
                playerVelocityY = jumpStrength;
                canJump = false;
            }

            const oldPos = player.position.clone();
            const speed = 0.12;
            if(keys['KeyW']) player.translateZ(-speed);
            if(keys['KeyS']) player.translateZ(speed);
            if(keys['KeyA']) player.translateX(-speed);
            if(keys['KeyD']) player.translateX(speed);
            walls.forEach(w => {
                if(Math.abs(player.position.x - w.position.x) < 2.5 && Math.abs(player.position.z - w.position.z) < 2.5) player.position.copy(oldPos);
            });

            enemies.forEach(e => {
                e.position.y = 2.0 + Math.sin(now * 0.002) * 0.2;
                const toP = new THREE.Vector3().subVectors(player.position, e.position);
                if(toP.length() > 10) e.position.add(toP.normalize().multiplyScalar(0.02));

                if (now - e.lastShootTime > 3500) {
                    // 敵の弾を赤色に変更
                    const eb = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xff0000}));
                    eb.position.copy(e.position);
                    eb.velocity = new THREE.Vector3().subVectors(player.position, eb.position).normalize().multiplyScalar(0.25);
                    scene.add(eb); enemyBullets.push(eb);
                    e.lastShootTime = now;
                }
            });

            for(let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i]; b.position.add(b.velocity);
                if(b.position.distanceTo(player.position) < 0.7 && now > invincibleUntil) {
                    hp -= 20; invincibleUntil = now + 800;
                    scene.remove(b); enemyBullets.splice(i, 1);
                    document.getElementById('hp-bar').style.width = hp + '%';
                    if(hp <= 0) { isStarted = false; document.exitPointerLock(); document.getElementById('title-text').innerText = "MISSION FAILED"; }
                } else if(b.position.length() > 100) { scene.remove(b); enemyBullets.splice(i, 1); }
            }

            for(let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i]; b.position.add(b.velocity);
                enemies.forEach((e, ei) => {
                    if(b.position.distanceTo(e.position) < 1.0) {
                        scene.remove(e); enemies.splice(ei, 1);
                        scene.remove(b); playerBullets.splice(i, 1);
                        score++; document.getElementById('score').innerText = score;
                        spawnEnemy();
                    }
                });
                if(b.position.length() > 100) { scene.remove(b); playerBullets.splice(i, 1); }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
