<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocal Sampler Studio (MP3版)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-color: #151d30;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
        }

        .status {
            text-align: center;
            background: #0b0f19;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="file"], textarea {
            width: 100%;
            padding: 10px;
            background: #0b0f19;
            border: 1px solid #374151;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
            height: 60px;
        }

        #monitor {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            color: var(--accent-color);
            margin: 20px 0;
            min-height: 60px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-play {
            background: var(--accent-color);
            color: white;
        }

        .btn-play:disabled {
            background: #4b5563;
            cursor: not-allowed;
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vocal Sampler Studio</h1>
    <div class="status" id="load-status">MP3ボイスライブラリをロード中... 🚀</div>

    <div class="form-group">
        <label>1. MIDIファイルをアップロード</label>
        <input type="file" id="midi-file" accept=".mid,.midi">
    </div>

    <div class="form-group">
        <label>2. 歌詞（ひらがな・カタカナのみ）</label>
        <textarea id="lyrics">かえるのうたがきこえてくるよ</textarea>
    </div>

    <div id="monitor">-</div>

    <div class="btn-group">
        <button id="play-btn" class="btn-play" disabled>歌わせる</button>
        <button id="stop-btn" class="btn-stop">ストップ</button>
    </div>
</div>

<script>
    // ひらがな -> 母音 マッピング
    const vowelMap = {
        'あ': 'a', 'か': 'a', 'さ': 'a', 'た': 'a', 'な': 'a', 'は': 'a', 'ま': 'a', 'や': 'a', 'ら': 'a', 'わ': 'a', 'が': 'a', 'ざ': 'a', 'だ': 'a', 'ば': 'a', 'ぱ': 'a',
        'い': 'i', 'き': 'i', 'し': 'i', 'ち': 'i', 'に': 'i', 'ひ': 'i', 'み': 'i', 'り': 'i', 'ぎ': 'i', 'じ': 'i', 'ぢ': 'i', 'び': 'i', 'ぴ': 'i',
        'う': 'u', 'く': 'u', 'す': 'u', 'つ': 'u', 'ぬ': 'u', 'ふ': 'u', 'む': 'u', 'ゆ': 'u', 'る': 'u', 'ぐ': 'u', 'ず': 'u', 'づ': 'u', 'ぶ': 'u', 'ぷ': 'u',
        'え': 'e', 'け': 'e', 'せ': 'e', 'て': 'e', 'ね': 'e', 'へ': 'e', 'め': 'e', 'れ': 'e', 'げ': 'e', 'ぜ': 'e', 'で': 'e', 'べ': 'e', 'ぺ': 'e',
        'お': 'o', 'こ': 'o', 'そ': 'o', 'と': 'o', 'の': 'o', 'ほ': 'o', 'も': 'o', 'よ': 'o', 'ろ': 'o', 'を': 'o', 'ご': 'o', 'ぞ': 'o', 'ど': 'o', 'ぼ': 'o', 'ぽ': 'o',
        'ん': 'n', 'ー': 'extend'
    };

    // カタカナをひらがなに変換する関数
    function kanaToHira(str) {
        return str.replace(/[\u30a1-\u30f6]/g, function(match) {
            var chr = match.charCodeAt(0) - 0x60;
            return String.fromCharCode(chr);
        });
    }

    let voices = {};
    let isLoaded = false;
    let loadedCount = 0;
    const vowels = ['a', 'i', 'u', 'e', 'o'];

    // 読み込み状況の表示用
    const statusEl = document.getElementById('load-status');
    statusEl.innerText = "ローカルのMP3ファイルをロード中...";

    // 各母音のサンプラーを同じフォルダから読み込む (.mp3に指定変更)
    // 修正後（女声や高めの音源なら、基準を A4 や C4 にしてみる）
        vowels.forEach(v => {
            voices[v] = new Tone.Sampler({
                urls: {
                    C5: `./${v}.mp3`  // ← ここを A4 または C4 に書き換えて保存！
                },
            onload: () => {
                loadedCount++;
                if (loadedCount === vowels.length) {
                    isLoaded = true;
                    statusEl.innerText = "全てのMP3の準備完了！MIDIを読み込んでください。";
                    if (parsedMidi) {
                        document.getElementById('play-btn').disabled = false;
                    }
                }
            },
            onerror: () => {
                statusEl.innerText = `エラー: 【${v}.mp3】が同じフォルダに見つかりません！`;
            }
        }).toDestination();
    });

    let parsedMidi = null;

    // MIDIファイルの読み込み処理
    document.getElementById('midi-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (event) => {
            try {
                parsedMidi = new Midi(event.target.result);
                if (isLoaded) {
                    document.getElementById('play-btn').disabled = false;
                } else {
                    alert("MP3ファイルがまだロード完了していません。同じフォルダ内のファイル名を確認してください。");
                }
            } catch (err) {
                alert("MIDIファイルの解析に失敗しました。");
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // 再生処理
    document.getElementById('play-btn').addEventListener('click', async () => {
        if (!parsedMidi || !isLoaded) return;
        
        await Tone.start();

        const lyricInput = kanaToHira(document.getElementById('lyrics').value.replace(/\s+/g, ''));
        const lyricsArray = Array.from(lyricInput);
        const track = parsedMidi.tracks.find(t => t.notes.length > 0);

        if (!track) {
            alert("有効な音符データを含むトラックがMIDI内にありませんでした。");
            return;
        }

        Tone.Transport.cancel();
        
        let lyricIdx = 0;
        let lastVowel = 'a';

        track.notes.forEach((note) => {
            const char = lyricsArray[lyricIdx % lyricsArray.length] || 'ー';
            let vowel = vowelMap[char] || 'a';
            
            if (vowel === 'extend' || vowel === 'n') {
                vowel = lastVowel;
            } else {
                lastVowel = vowel;
            }
            lyricIdx++;

            Tone.Transport.schedule((time) => {
                if (voices[vowel] && voices[vowel].loaded) {
                    voices[vowel].triggerAttackRelease(note.name, note.duration, time);
                }

                Tone.Draw.schedule(() => {
                    document.getElementById('monitor').innerText = char;
                }, time);
            }, note.time);
        });

        Tone.Transport.start();
    });

    // 停止処理
    document.getElementById('stop-btn').addEventListener('click', () => {
        Tone.Transport.stop();
        vowels.forEach(v => {
            if (voices[v] && voices[v].loaded) {
                voices[v].releaseAll();
            }
        });
    });
</script>

</body>
</html>
