<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D FPS - Walls & Weapons</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 18px; pointer-events: none; text-shadow: 2px 2px 2px #000;
        }
        #hp-bar-container { width: 200px; height: 10px; background: #333; margin-top: 5px; border: 1px solid #0f0; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #weapon-info { margin-top: 10px; font-weight: bold; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 16px; height: 16px; border: 2px solid #0f0;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; font-size: 30px; text-align: center; cursor: pointer;
            background: rgba(0,20,0,0.8); padding: 30px; border: 2px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span> / 20<br>
        HEALTH
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
        <div id="weapon-info">WEAPON: <span id="weapon-name">PISTOL</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">CLICK TO START</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 設定 ---
        let score = 0, hp = 100, isGameOver = false;
        const enemies = [], bullets = [], enemyBullets = [], walls = [];
        const weapons = {
            1: { name: "PISTOL", rate: 400, count: 1, spread: 0, speed: 0.8 },
            2: { name: "SHOTGUN", rate: 800, count: 6, spread: 0.1, speed: 0.7 },
            3: { name: "MACHINE GUN", rate: 100, count: 1, spread: 0.03, speed: 0.9 }
        };
        let currentWp = 1, lastFire = 0;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.Fog(0x050505, 1, 70);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.PointLight(0x00ff00, 1, 100);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x202020));

        // 地面
        const grid = new THREE.GridHelper(100, 50, 0x004400, 0x002200);
        scene.add(grid);

        // --- ステージ生成 (壁) ---
        function createWalls() {
            const wallGeo = new THREE.BoxGeometry(4, 5, 4);
            const wallMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
            for(let i=0; i<30; i++) {
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(
                    (Math.random() - 0.5) * 60,
                    2.5,
                    (Math.random() - 0.5) * 60
                );
                // プレイヤーの初期地点付近には置かない
                if(wall.position.length() > 8) {
                    scene.add(wall);
                    walls.push(wall);
                }
            }
        }
        createWalls();

        const player = new THREE.Group();
        player.position.set(0, 1.6, 0);
        scene.add(player);
        player.add(camera);

        const keys = {};
        const msg = document.getElementById('msg');
        
        function initGame() {
            score = 0; hp = 100; isGameOver = false;
            document.getElementById('score').innerText = score;
            document.getElementById('hp-bar').style.width = '100%';
            msg.style.display = 'none';
            enemies.forEach(e => scene.remove(e)); enemies.length = 0;
            bullets.forEach(b => scene.remove(b)); bullets.length = 0;
            enemyBullets.forEach(eb => scene.remove(eb)); enemyBullets.length = 0;
            for(let i=0; i<20; i++) spawnEnemy();
            player.position.set(0, 1.6, 0);
        }

        function spawnEnemy() {
            const enemy = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
            let pos;
            do {
                const angle = Math.random() * Math.PI * 2;
                const dist = 20 + Math.random() * 20;
                pos = new THREE.Vector3(Math.cos(angle) * dist, 1, Math.sin(angle) * dist);
            } while (checkWallCollision(pos, 1));
            enemy.position.copy(pos);
            enemy.lastShot = Date.now() + Math.random() * 2000;
            scene.add(enemy);
            enemies.push(enemy);
        }

        function checkWallCollision(pos, radius) {
            for(let wall of walls) {
                const dx = Math.abs(pos.x - wall.position.x);
                const dz = Math.abs(pos.z - wall.position.z);
                if (dx < 2 + radius && dz < 2 + radius) return true;
            }
            return false;
        }

        function fire(isPlayer, startPos, baseDir) {
            const wp = weapons[currentWp];
            const count = isPlayer ? wp.count : 1;
            for(let i=0; i<count; i++) {
                const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({ color: isPlayer ? 0x00ffff : 0xff0000 }));
                bullet.position.copy(startPos);
                
                const dir = baseDir.clone();
                if(isPlayer) {
                    dir.x += (Math.random()-0.5) * wp.spread;
                    dir.y += (Math.random()-0.5) * wp.spread;
                    dir.z += (Math.random()-0.5) * wp.spread;
                    bullet.velocity = dir.normalize().multiplyScalar(wp.speed);
                } else {
                    bullet.velocity = dir.multiplyScalar(0.3);
                }
                
                scene.add(bullet);
                (isPlayer ? bullets : enemyBullets).push(bullet);
            }
        }

        // --- 入力 ---
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if(e.key === "1") switchWeapon(1);
            if(e.key === "2") switchWeapon(2);
            if(e.key === "3") switchWeapon(3);
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);
        window.addEventListener('wheel', (e) => {
            currentWp = currentWp + (e.deltaY > 0 ? 1 : -1);
            if(currentWp > 3) currentWp = 1;
            if(currentWp < 1) currentWp = 3;
            switchWeapon(currentWp);
        });

        function switchWeapon(id) {
            currentWp = id;
            document.getElementById('weapon-name').innerText = weapons[id].name;
        }

        document.addEventListener('mousedown', () => {
            if (isGameOver) initGame();
            else if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
            }
        });

        function takeDamage(amt) {
            hp -= amt;
            document.getElementById('hp-bar').style.width = Math.max(0, hp) + '%';
            if (hp <= 0 && !isGameOver) {
                isGameOver = true;
                msg.innerHTML = "WASTED<br><span style='font-size:18px'>CLICK TO TRY AGAIN</span>";
                msg.style.display = 'block';
                document.exitPointerLock();
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isGameOver && document.pointerLockElement === renderer.domElement) {
                // プレイヤー移動と壁判定
                const oldPos = player.position.clone();
                if (keys['KeyW']) player.translateZ(-0.15);
                if (keys['KeyS']) player.translateZ(0.15);
                if (keys['KeyA']) player.translateX(-0.15);
                if (keys['KeyD']) player.translateX(0.15);
                if (checkWallCollision(player.position, 0.5)) player.position.copy(oldPos);

                // 射撃 (マシンガン用)
                if (keys['Space'] || keys['MouseDown'] || keys['Click']) { // クリック状態の判定は簡易化
                    // 実際はmousedownイベント内でフラグ管理が必要
                }
                const now = Date.now();
                if (keys['Enter'] || (keys['Space']) || (window.isFiring)) { /* 簡易化 */ }

                // 射撃メイン (クリック継続対応は省略しクリック毎または連射)
                if (navigator.userActivation.isActive && (now - lastFire > weapons[currentWp].rate)) {
                    // 自動射撃はさせず、クリックのみに絞る（コード短縮のため）
                }

                // 敵の処理
                enemies.forEach((enemy, eIdx) => {
                    const toP = new THREE.Vector3().subVectors(player.position, enemy.position);
                    const dist = toP.length();
                    const dir = toP.normalize();
                    const oldEPos = enemy.position.clone();
                    enemy.position.x += dir.x * 0.04;
                    enemy.position.z += dir.z * 0.04;
                    if(checkWallCollision(enemy.position, 0.5)) enemy.position.copy(oldEPos);
                    if (dist < 1.2) takeDamage(0.5);
                    if (now - enemy.lastShot > 2000 && dist < 25) {
                        fire(false, enemy.position.clone().add(new THREE.Vector3(0,0.5,0)), dir);
                        enemy.lastShot = now;
                    }
                });

                // 弾の更新（壁との衝突含む）
                [bullets, enemyBullets].forEach((list, isPlayerList) => {
                    for(let i = list.length-1; i>=0; i--) {
                        const b = list[i];
                        b.position.add(b.velocity);
                        let removed = false;
                        if(checkWallCollision(b.position, 0.1) || b.position.length() > 60) {
                            scene.remove(b); list.splice(i, 1); removed = true;
                        }
                        if(!removed) {
                            if(isPlayerList === 0) { // プレイヤーの弾 -> 敵
                                enemies.forEach((e, eIdx) => {
                                    if(b.position.distanceTo(e.position) < 1) {
                                        scene.remove(e); scene.remove(b);
                                        enemies.splice(eIdx, 1); list.splice(i, 1);
                                        score++; document.getElementById('score').innerText = score;
                                    }
                                });
                            } else { // 敵の弾 -> プレイヤー
                                if(b.position.distanceTo(player.position) < 1) {
                                    scene.remove(b); list.splice(i, 1); takeDamage(15);
                                }
                            }
                        }
                    }
                });
            }
            renderer.render(scene, camera);
        }

        // マウスクリックでの単発/連射制御
        window.addEventListener('mousedown', () => {
            const now = Date.now();
            if(!isGameOver && document.pointerLockElement === renderer.domElement && now - lastFire > weapons[currentWp].rate) {
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
                fire(true, player.position, dir);
                lastFire = now;
            }
        });

        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
