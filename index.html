<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D FPS - Fix Start Button</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 18px; pointer-events: none; text-shadow: 2px 2px 2px #000;
        }
        #hp-bar-container { width: 200px; height: 10px; background: #333; margin-top: 5px; border: 1px solid #0f0; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.2s; }
        #msg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #0f0; font-size: 30px; text-align: center; cursor: pointer;
            background: rgba(0,10,0,0.85); z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span> / 20<br>
        HEALTH
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
    </div>
    <div id="msg">
        <div>CLICK TO START</div>
        <div style="font-size: 16px; margin-top: 10px; color: #8f8;">(画面のどこでもクリックしてください)</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0, hp = 100, isGameOver = true;
        let invincibleTime = 0;
        const enemies = [], bullets = [], walls = [];
        const keys = {};

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const player = new THREE.Group();
        scene.add(player);
        player.add(camera);

        // 地面と壁
        scene.add(new THREE.GridHelper(100, 40, 0x00ff00, 0x222222));
        const wallGeo = new THREE.BoxGeometry(4, 5, 4);
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        for(let i=0; i<20; i++) {
            const w = new THREE.Mesh(wallGeo, wallMat);
            const a = Math.random() * Math.PI * 2;
            const d = 20 + Math.random() * 20;
            w.position.set(Math.cos(a)*d, 2.5, Math.sin(a)*d);
            scene.add(w); walls.push(w);
        }

        const msg = document.getElementById('msg');

        // --- スタートとロックの修正 ---
        function requestStart() {
            if (isGameOver) {
                resetGame();
            }
            // ブラウザにポインターロックを要求
            renderer.domElement.requestPointerLock();
        }

        // 画面クリックで開始
        msg.addEventListener('click', requestStart);
        
        // ポインターロックの状態変化を監視
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === renderer.domElement) {
                msg.style.display = 'none'; // ロック成功したら消す
                isGameOver = false;
            } else {
                msg.style.display = 'flex'; // 解除されたら出す
                if(!isGameOver) {
                   msg.innerHTML = "<div>PAUSED</div><div style='font-size:16px'>CLICK TO RESUME</div>";
                }
            }
        });

        function resetGame() {
            score = 0; hp = 100;
            document.getElementById('score').innerText = score;
            document.getElementById('hp-bar').style.width = '100%';
            enemies.forEach(e => scene.remove(e));
            bullets.forEach(b => scene.remove(b));
            enemies.length = 0; bullets.length = 0;
            player.position.set(0, 1.6, 0);
            for(let i=0; i<15; i++) {
                const e = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), new THREE.MeshPhongMaterial({color: 0xff4444}));
                const a = Math.random() * Math.PI * 2;
                const d = 30 + Math.random() * 10;
                e.position.set(Math.cos(a)*d, 1.1, Math.sin(a)*d);
                e.lastAttack = 0;
                scene.add(e); enemies.push(e);
            }
        }

        // --- 入力と更新 ---
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            }
        });

        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);

        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: 0xffff00}));
                const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
                b.position.copy(player.position);
                b.velocity = dir.multiplyScalar(1.2);
                scene.add(b); bullets.push(b);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                const oldPos = player.position.clone();
                if(keys['KeyW']) player.translateZ(-0.1);
                if(keys['KeyS']) player.translateZ(0.1);
                if(keys['KeyA']) player.translateX(-0.1);
                if(keys['KeyD']) player.translateX(0.1);
                
                walls.forEach(w => {
                    if(Math.abs(player.position.x - w.position.x) < 2.5 && Math.abs(player.position.z - w.position.z) < 2.5) player.position.copy(oldPos);
                });

                const now = Date.now();
                enemies.forEach(e => {
                    const toP = new THREE.Vector3().subVectors(player.position, e.position);
                    e.position.add(toP.normalize().multiplyScalar(0.02));
                    if(toP.length() < 1.4 && now > invincibleTime) {
                        hp -= 20;
                        invincibleTime = now + 1000;
                        e.position.sub(toP.normalize().multiplyScalar(5));
                        document.getElementById('hp-bar').style.width = hp + '%';
                        if(hp <= 0) {
                            isGameOver = true;
                            msg.innerHTML = "<div>GAME OVER</div><div style='font-size:16px'>CLICK TO TRY AGAIN</div>";
                            document.exitPointerLock();
                        }
                    }
                });

                for(let i=bullets.length-1; i>=0; i--) {
                    const b = bullets[i]; b.position.add(b.velocity);
                    enemies.forEach((e, ei) => {
                        if(b.position.distanceTo(e.position) < 1.5) {
                            scene.remove(e); enemies.splice(ei, 1);
                            scene.remove(b); bullets.splice(i, 1);
                            score++; document.getElementById('score').innerText = score;
                        }
                    });
                }
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
