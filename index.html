<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D FPS - Crouch & Dodge</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 18px; pointer-events: none; text-shadow: 2px 2px 2px #000;
        }
        #hp-bar-container { width: 200px; height: 10px; background: #333; margin-top: 5px; border: 1px solid #0f0; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #weapon-info { margin-top: 10px; font-weight: bold; }
        #controls-hint { margin-top: 10px; font-size: 12px; color: #aaa; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 16px; height: 16px; border: 2px solid #0f0;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; font-size: 30px; text-align: center; cursor: pointer;
            background: rgba(0,20,0,0.8); padding: 30px; border: 2px solid #0f0; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span> / 20<br>
        HEALTH
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
        <div id="weapon-info">WEAPON: <span id="weapon-name">PISTOL</span></div>
        <div id="controls-hint">W,A,S,D: MOVE | SHIFT: CROUCH | 1-3: SWAP</div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">CLICK TO START</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 設定 ---
        let score = 0, hp = 100, isGameOver = false;
        const enemies = [], bullets = [], enemyBullets = [], walls = [], particles = [];
        const weapons = {
            1: { name: "PISTOL", rate: 400, count: 1, spread: 0, speed: 1.2, shake: 0.05 },
            2: { name: "SHOTGUN", rate: 800, count: 8, spread: 0.15, speed: 1.0, shake: 0.2 },
            3: { name: "MACHINE GUN", rate: 80, count: 1, spread: 0.05, speed: 1.5, shake: 0.03 }
        };
        let currentWp = 1, lastFire = 0, walkTime = 0, shakeAmount = 0;

        // プレイヤー状態
        let isCrouching = false;
        const playerHeight = { stand: 1.6, crouch: 0.8 };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        scene.fog = new THREE.Fog(0x020205, 1, 60);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const flashLight = new THREE.PointLight(0x00ffff, 0, 10);
        scene.add(flashLight);
        scene.add(new THREE.AmbientLight(0x202020));

        // ステージ構築
        const wallGeo = new THREE.BoxGeometry(4, 5, 4);
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x111111, emissive: 0x050505 });
        for(let i=0; i<35; i++) {
            const wall = new THREE.Mesh(wallGeo, wallMat);
            const angle = Math.random() * Math.PI * 2;
            const dist = 10 + Math.random() * 40;
            wall.position.set(Math.cos(angle)*dist, 2.5, Math.sin(angle)*dist);
            scene.add(wall);
            walls.push(wall);
        }

        const player = new THREE.Group();
        player.position.set(0, playerHeight.stand, 0);
        scene.add(player);
        player.add(camera);

        const keys = {};
        const msg = document.getElementById('msg');

        function createExplosion(pos, color) {
            for(let i=0; i<6; i++) {
                const p = new THREE.Mesh(new THREE.SphereGeometry(0.05), new THREE.MeshBasicMaterial({ color: color }));
                p.position.copy(pos);
                p.velocity = new THREE.Vector3((Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2, (Math.random()-0.5)*0.2);
                p.life = 1.0;
                scene.add(p);
                particles.push(p);
            }
        }

        function fire(isPlayer, startPos, baseDir) {
            const wp = weapons[currentWp];
            if(isPlayer) {
                shakeAmount = wp.shake;
                flashLight.position.copy(startPos).add(baseDir.clone().multiplyScalar(0.5));
                flashLight.intensity = 2;
                setTimeout(() => flashLight.intensity = 0, 50);
            }

            const count = isPlayer ? wp.count : 1;
            for(let i=0; i<count; i++) {
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.4), new THREE.MeshBasicMaterial({ color: isPlayer ? 0x00ffff : 0xff3300 }));
                b.position.copy(startPos);
                const dir = baseDir.clone();
                if(isPlayer) {
                    dir.x += (Math.random()-0.5)*wp.spread; dir.y += (Math.random()-0.5)*wp.spread; dir.z += (Math.random()-0.5)*wp.spread;
                }
                b.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), dir.normalize());
                b.velocity = dir.multiplyScalar(isPlayer ? wp.speed : 0.35);
                scene.add(b);
                (isPlayer ? bullets : enemyBullets).push(b);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const now = Date.now();

            if (!isGameOver && document.pointerLockElement === renderer.domElement) {
                // しゃがみ状態の更新
                isCrouching = keys['ShiftLeft'] || keys['ShiftRight'];
                const targetY = isCrouching ? playerHeight.crouch : playerHeight.stand;
                player.position.y += (targetY - player.position.y) * 0.2; // スムーズな沈み込み

                // 移動
                let isMoving = false;
                const speed = isCrouching ? 0.07 : 0.15;
                const oldPos = player.position.clone();
                if (keys['KeyW']) { player.translateZ(-speed); isMoving = true; }
                if (keys['KeyS']) { player.translateZ(speed); isMoving = true; }
                if (keys['KeyA']) { player.translateX(-speed); isMoving = true; }
                if (keys['KeyD']) { player.translateX(speed); isMoving = true; }
                if (checkWallCollision(player.position, 0.6)) player.position.copy(oldPos);

                if(isMoving) {
                    walkTime += isCrouching ? 0.08 : 0.15;
                    camera.position.y = Math.sin(walkTime) * (isCrouching ? 0.02 : 0.05);
                }

                if(shakeAmount > 0) {
                    camera.position.x += (Math.random()-0.5) * shakeAmount;
                    camera.position.y += (Math.random()-0.5) * shakeAmount;
                    shakeAmount *= 0.9;
                }

                // 敵
                enemies.forEach(e => {
                    const toP = new THREE.Vector3().subVectors(player.position, e.position);
                    const dir = toP.clone().normalize();
                    e.position.x += dir.x * 0.045;
                    e.position.z += dir.z * 0.045;
                    if(toP.length() < 1.2) { hp -= 0.3; updateHP(); }
                    if(now - e.lastShot > 2200 && toP.length() < 35) {
                        // 敵は胸の高さを狙って撃つ
                        const shootDir = new THREE.Vector3().subVectors(
                            player.position.clone().setY(playerHeight.stand), 
                            e.position
                        ).normalize();
                        fire(false, e.position.clone().add(new THREE.Vector3(0,0.6,0)), shootDir);
                        e.lastShot = now;
                    }
                });

                updateBullets(bullets, true);
                updateBullets(enemyBullets, false);

                for(let i=particles.length-1; i>=0; i--) {
                    const p = particles[i]; p.position.add(p.velocity); p.life -= 0.02;
                    p.scale.setScalar(p.life); if(p.life <= 0) { scene.remove(p); particles.splice(i,1); }
                }
            }
            renderer.render(scene, camera);
        }

        function updateBullets(list, isPlayer) {
            for(let i=list.length-1; i>=0; i--) {
                const b = list[i]; b.position.add(b.velocity);
                if(checkWallCollision(b.position, 0.1)) {
                    createExplosion(b.position, isPlayer ? 0x00ffff : 0xff3300);
                    scene.remove(b); list.splice(i, 1); continue;
                }
                if(isPlayer) {
                    enemies.forEach((e, ei) => {
                        if(b.position.distanceTo(e.position) < 1.2) {
                            createExplosion(e.position, 0xff0000);
                            scene.remove(e); scene.remove(b);
                            enemies.splice(ei, 1); list.splice(i, 1);
                            score++; document.getElementById('score').innerText = score;
                            if(score >= 20) endGame(true);
                        }
                    });
                } else {
                    // プレイヤーの現在位置（しゃがみ考慮）との距離判定
                    const pBodyPos = player.position.clone();
                    if(b.position.distanceTo(pBodyPos) < 0.7) {
                        hp -= 15; updateHP(); shakeAmount = 0.3;
                        scene.remove(b); list.splice(i, 1);
                    }
                }
            }
        }

        function checkWallCollision(pos, r) {
            for(let w of walls) if(Math.abs(pos.x - w.position.x) < 2+r && Math.abs(pos.z - w.position.z) < 2+r) return true;
            return false;
        }

        function updateHP() {
            document.getElementById('hp-bar').style.width = Math.max(0, hp) + '%';
            if(hp <= 0) endGame(false);
        }

        function endGame(win) {
            isGameOver = true;
            msg.innerHTML = win ? "MISSION COMPLETE" : "YOU DIED";
            msg.style.display = 'block'; document.exitPointerLock();
        }

        document.addEventListener('keydown', e => {
            keys[e.code] = true;
            if(e.key === "1") switchW(1); if(e.key === "2") switchW(2); if(e.key === "3") switchW(3);
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        document.addEventListener('mousedown', () => {
            if(isGameOver) location.reload();
            if(document.pointerLockElement !== renderer.domElement) {
                renderer.domElement.requestPointerLock();
                msg.style.display = 'none';
                if(enemies.length === 0) for(let i=0; i<20; i++) {
                    const e = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x220000 }));
                    e.position.set((Math.random()-0.5)*80, 1, (Math.random()-0.5)*80);
                    if(e.position.length() < 12) e.position.x += 20;
                    e.lastShot = 0; scene.add(e); enemies.push(e);
                }
            } else {
                const now = Date.now();
                if(now - lastFire > weapons[currentWp].rate) {
                    const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
                    fire(true, player.position, dir);
                    lastFire = now;
                }
            }
        });

        function switchW(id) { currentWp = id; document.getElementById('weapon-name').innerText = weapons[id].name; }
        
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
