<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D FPS - Input Fixed</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 18px; pointer-events: none; text-shadow: 2px 2px 2px #000;
        }
        #hp-bar-container { width: 200px; height: 10px; background: #333; margin-top: 5px; border: 1px solid #0f0; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #weapon-info { margin-top: 10px; font-weight: bold; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 16px; height: 16px; border: 2px solid #0f0;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; font-size: 30px; text-align: center; cursor: pointer;
            background: rgba(0,20,0,0.9); padding: 40px; border: 2px solid #0f0; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span> / 20<br>
        HEALTH
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
        <div id="weapon-info">WEAPON: <span id="weapon-name">PISTOL</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">CLICK TO START<br><span style="font-size: 16px;">マウス移動で視点変更</span></div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 設定 ---
        let score = 0, hp = 100, isGameOver = false;
        const enemies = [], bullets = [], enemyBullets = [], walls = [];
        let currentWp = 1, lastFire = 0;
        const weapons = {
            1: { name: "PISTOL", rate: 400, count: 1, spread: 0, speed: 1.2 },
            2: { name: "SHOTGUN", rate: 800, count: 8, spread: 0.15, speed: 1.0 },
            3: { name: "MACHINE GUN", rate: 80, count: 1, spread: 0.05, speed: 1.5 }
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020205);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x404040));
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(10, 20, 10);
        scene.add(light);

        // 壁と地面
        const grid = new THREE.GridHelper(100, 50, 0x00ff00, 0x222222);
        scene.add(grid);
        for(let i=0; i<30; i++) {
            const w = new THREE.Mesh(new THREE.BoxGeometry(4,5,4), new THREE.MeshPhongMaterial({color: 0x222222}));
            w.position.set((Math.random()-0.5)*80, 2.5, (Math.random()-0.5)*80);
            if(w.position.length() > 10) { scene.add(w); walls.push(w); }
        }

        const player = new THREE.Group();
        player.position.set(0, 1.6, 0);
        scene.add(player);
        player.add(camera);

        const keys = {};
        const msg = document.getElementById('msg');

        // --- 視点移動の重要修正 ---
        function onMouseMove(e) {
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                // movementX/Y が取れないブラウザ向けの代替処理はせず、
                // ポインターロック時の標準的な取得方法を徹底
                const movementX = e.movementX || e.mozMovementX || e.webkitMovementX || 0;
                const movementY = e.movementY || e.mozMovementY || e.webkitMovementY || 0;

                player.rotation.y -= movementX * 0.002;
                camera.rotation.x -= movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, camera.rotation.x));
            }
        }
        document.addEventListener('mousemove', onMouseMove, false);

        // --- 入力系 ---
        document.addEventListener('keydown', e => { 
            keys[e.code] = true;
            if(e.key === "1") switchW(1); if(e.key === "2") switchW(2); if(e.key === "3") switchW(3);
        });
        document.addEventListener('keyup', e => keys[e.code] = false);

        msg.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === renderer.domElement) {
                msg.style.display = 'none';
                if(enemies.length === 0) spawnEnemies();
            } else {
                if(!isGameOver) msg.style.display = 'block';
            }
        });

        // 射撃
        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                const now = Date.now();
                if(now - lastFire > weapons[currentWp].rate) {
                    fire();
                    lastFire = now;
                }
            }
        });

        function switchW(id) { currentWp = id; document.getElementById('weapon-name').innerText = weapons[id].name; }

        function fire() {
            const wp = weapons[currentWp];
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
            for(let i=0; i<wp.count; i++) {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({color: 0x00ffff}));
                b.position.copy(player.position);
                const bDir = dir.clone();
                bDir.x += (Math.random()-0.5)*wp.spread; bDir.y += (Math.random()-0.5)*wp.spread;
                b.velocity = bDir.normalize().multiplyScalar(wp.speed);
                scene.add(b); bullets.push(b);
            }
        }

        function spawnEnemies() {
            for(let i=0; i<20; i++) {
                const e = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 1.2), new THREE.MeshPhongMaterial({color: 0xff0000}));
                e.position.set((Math.random()-0.5)*70, 1, (Math.random()-0.5)*70);
                if(e.position.length() < 10) e.position.x += 15;
                e.lastShot = 0; scene.add(e); enemies.push(e);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                // 移動
                const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 0.07 : 0.15;
                const targetHeight = (keys['ShiftLeft'] || keys['ShiftRight']) ? 0.8 : 1.6;
                player.position.y += (targetHeight - player.position.y) * 0.1;
                
                const oldPos = player.position.clone();
                if(keys['KeyW']) player.translateZ(-speed);
                if(keys['KeyS']) player.translateZ(speed);
                if(keys['KeyA']) player.translateX(-speed);
                if(keys['KeyD']) player.translateX(speed);
                
                walls.forEach(w => {
                    if(Math.abs(player.position.x - w.position.x) < 2.5 && Math.abs(player.position.z - w.position.z) < 2.5) {
                        player.position.copy(oldPos);
                    }
                });

                // 弾の移動と判定
                for(let i=bullets.length-1; i>=0; i--) {
                    const b = bullets[i]; b.position.add(b.velocity);
                    enemies.forEach((e, ei) => {
                        if(b.position.distanceTo(e.position) < 1.2) {
                            scene.remove(e); scene.remove(b);
                            enemies.splice(ei, 1); bullets.splice(i, 1);
                            score++; document.getElementById('score').innerText = score;
                        }
                    });
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
