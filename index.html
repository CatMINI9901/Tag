<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D FPS - Jump Added</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 18px; pointer-events: none; text-shadow: 2px 2px 2px #000;
        }
        #hp-bar-container { width: 200px; height: 10px; background: #333; margin-top: 5px; border: 1px solid #0f0; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.2s; }
        #msg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #0f0; font-size: 30px; text-align: center; cursor: pointer;
            background: rgba(0,0,0,0.8); z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span><br>
        HEALTH
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
        <div style="font-size: 12px; color: #0ff; margin-top: 5px;">SPACE: JUMP | Orange Bullets: Enemy</div>
    </div>
    <div id="msg" onclick="startGame()">
        <div id="title-text">CLICK TO START</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0, hp = 100, isStarted = false;
        let invincibleUntil = 0;
        const enemies = [], playerBullets = [], enemyBullets = [], walls = [];
        const keys = {};

        // 物理パラメータ
        let playerVelocityY = 0;
        const gravity = -0.012;
        const jumpStrength = 0.25;
        let canJump = false;

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const player = new THREE.Group();
        player.position.set(0, 1.6, 0);
        scene.add(player);
        player.add(camera);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        // 地面
        const grid = new THREE.GridHelper(200, 50, 0x00ff00, 0x222222);
        scene.add(grid);

        // 壁
        const wallGeo = new THREE.BoxGeometry(4, 8, 4);
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x222222 });
        for(let i=0; i<20; i++) {
            const w = new THREE.Mesh(wallGeo, wallMat);
            const a = Math.random() * Math.PI * 2;
            const d = 25 + Math.random() * 25;
            w.position.set(Math.cos(a)*d, 4, Math.sin(a)*d);
            scene.add(w); walls.push(w);
        }

        const msg = document.getElementById('msg');

        window.startGame = function() {
            hp = 100; score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('hp-bar').style.width = '100%';
            enemies.forEach(e => scene.remove(e));
            playerBullets.forEach(b => scene.remove(b));
            enemyBullets.forEach(b => scene.remove(b));
            enemies.length = 0; playerBullets.length = 0; enemyBullets.length = 0;
            player.position.set(0, 1.6, 0);
            playerVelocityY = 0;
            for(let i=0; i<10; i++) spawnEnemy();
            isStarted = true;
            renderer.domElement.requestPointerLock();
        }

        function spawnEnemy() {
            const e = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), new THREE.MeshPhongMaterial({color: 0xff0000}));
            const a = Math.random() * Math.PI * 2;
            const d = 30 + Math.random() * 20;
            e.position.set(Math.cos(a)*d, 1.1, Math.sin(a)*d);
            e.lastShootTime = Date.now() + Math.random() * 2000;
            scene.add(e); enemies.push(e);
        }

        document.addEventListener('pointerlockchange', () => {
            msg.style.display = document.pointerLockElement === renderer.domElement ? 'none' : 'flex';
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            }
        });
        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);

        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement === renderer.domElement && isStarted) {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.15), new THREE.MeshBasicMaterial({color: 0x00ffff}));
                const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
                b.position.copy(player.position);
                b.velocity = dir.multiplyScalar(1.5);
                scene.add(b); playerBullets.push(b);
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            if (!isStarted || document.pointerLockElement !== renderer.domElement) {
                renderer.render(scene, camera);
                return;
            }

            const now = Date.now();

            // --- ジャンプ & 重力 ---
            playerVelocityY += gravity;
            player.position.y += playerVelocityY;

            // 地面判定 (しゃがみ時を考慮)
            const isCrouching = keys['ShiftLeft'] || keys['ShiftRight'];
            const floorY = isCrouching ? 0.8 : 1.6;
            if (player.position.y <= floorY) {
                player.position.y = floorY;
                playerVelocityY = 0;
                canJump = true;
            } else {
                canJump = false;
            }

            if (keys['Space'] && canJump) {
                playerVelocityY = jumpStrength;
                canJump = false;
            }

            // --- 移動 ---
            const oldPos = player.position.clone();
            const speed = isCrouching ? 0.06 : 0.15;
            if(keys['KeyW']) player.translateZ(-speed);
            if(keys['KeyS']) player.translateZ(speed);
            if(keys['KeyA']) player.translateX(-speed);
            if(keys['KeyD']) player.translateX(speed);
            walls.forEach(w => {
                if(Math.abs(player.position.x - w.position.x) < 2.5 && Math.abs(player.position.z - w.position.z) < 2.5) player.position.copy(oldPos);
            });

            // --- 敵の射撃と弾 ---
            enemies.forEach(e => {
                const toP = new THREE.Vector3().subVectors(player.position, e.position);
                if(toP.length() > 12) e.position.add(toP.clone().normalize().multiplyScalar(0.02));
                if (now - e.lastShootTime > 3000) {
                    const eb = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshBasicMaterial({color: 0xff8800}));
                    eb.position.copy(e.position).setY(1.5);
                    eb.velocity = new THREE.Vector3().subVectors(player.position, eb.position).normalize().multiplyScalar(0.3);
                    scene.add(eb); enemyBullets.push(eb);
                    e.lastShootTime = now;
                }
            });

            for(let i = enemyBullets.length - 1; i >= 0; i--) {
                const b = enemyBullets[i]; b.position.add(b.velocity);
                if(b.position.distanceTo(player.position) < 0.8 && now > invincibleUntil) {
                    hp -= 20; invincibleUntil = now + 500;
                    scene.remove(b); enemyBullets.splice(i, 1);
                    document.getElementById('hp-bar').style.width = hp + '%';
                    if(hp <= 0) { isStarted = false; document.exitPointerLock(); document.getElementById('title-text').innerText = "GAME OVER"; }
                    continue;
                }
                if(b.position.length() > 100) { scene.remove(b); enemyBullets.splice(i, 1); }
            }

            for(let i = playerBullets.length - 1; i >= 0; i--) {
                const b = playerBullets[i]; b.position.add(b.velocity);
                enemies.forEach((e, ei) => {
                    if(b.position.distanceTo(e.position) < 1.6) {
                        scene.remove(e); enemies.splice(ei, 1);
                        scene.remove(b); playerBullets.splice(i, 1);
                        score++; document.getElementById('score').innerText = score;
                        spawnEnemy(); // 敵を補充
                    }
                });
                if(b.position.length() > 100) { scene.remove(b); playerBullets.splice(i, 1); }
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
