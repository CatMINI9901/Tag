<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D FPS - Multi Device</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 15px; left: 15px; color: #0f0; pointer-events: none; z-index: 10; }
        #hp-bar-container { width: 150px; height: 8px; background: #333; border: 1px solid #0f0; margin-top: 5px; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; }
        
        /* スマホ用UI (デフォルトは非表示) */
        .mobile-ui { display: none; }
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px;
            background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
        }
        #joystick-stick {
            position: absolute; top: 25px; left: 25px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.5); border-radius: 50%;
        }
        #jump-btn {
            position: absolute; bottom: 50px; right: 40px; width: 70px; height: 70px;
            background: rgba(0,255,0,0.2); border: 2px solid #0f0; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: #0f0; font-weight: bold;
        }

        #msg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #0f0; font-size: 24px; background: rgba(0,0,0,0.85); z-index: 100; cursor: pointer;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid #0f0; border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span>
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
    </div>
    
    <div id="crosshair"></div>

    <div id="joystick-base" class="mobile-ui"><div id="joystick-stick"></div></div>
    <div id="jump-btn" class="mobile-ui">JUMP</div>
    
    <div id="msg" onclick="startGame()">
        <div id="start-text">CLICK / TOUCH TO START</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0, hp = 100, isStarted = false, isMobile = false;
        const enemies = [], playerBullets = [], enemyBullets = [], walls = [];
        const keys = {};
        const joystick = { x: 0, y: 0, active: false };
        let touchLookX = 0, touchLookY = 0;
        let playerVelocityY = 0;

        // デバイス判定
        isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent) || ('ontouchstart' in window);
        if(isMobile) document.querySelectorAll('.mobile-ui').forEach(el => el.style.display = 'block');

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const player = new THREE.Group();
        player.position.set(0, 1.6, 0);
        scene.add(player);
        player.add(camera);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        scene.add(new THREE.GridHelper(200, 50, 0x004400, 0x111111));

        // --- 操作イベント ---
        
        // PCキーボード
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // PCマウス射撃
        window.addEventListener('mousedown', () => {
            if (!isMobile && isStarted && document.pointerLockElement === renderer.domElement) fire();
        });

        // PCマウス視点
        window.addEventListener('mousemove', (e) => {
            if (!isMobile && isStarted && document.pointerLockElement === renderer.domElement) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
            }
        });

        // スマホタッチ操作
        if(isMobile) {
            window.addEventListener('touchstart', (e) => {
                for (let t of e.touches) {
                    if (t.clientX < window.innerWidth / 2) joystick.active = true;
                }
            });
            window.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let t of e.touches) {
                    if (t.clientX < window.innerWidth / 2) {
                        const bx = 40 + 50, by = window.innerHeight - 40 - 50;
                        let dx = t.clientX - bx, dy = t.clientY - by;
                        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
                        const angle = Math.atan2(dy, dx);
                        joystick.x = (Math.cos(angle) * dist) / 50;
                        joystick.y = (Math.sin(angle) * dist) / 50;
                        document.getElementById('joystick-stick').style.transform = `translate(${joystick.x * 40}px, ${joystick.y * 40}px)`;
                    } else {
                        if (touchLookX !== 0) {
                            player.rotation.y -= (t.clientX - touchLookX) * 0.006;
                            camera.rotation.x -= (t.clientY - touchLookY) * 0.006;
                            camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
                        }
                        touchLookX = t.clientX; touchLookY = t.clientY;
                    }
                }
            }, { passive: false });
            window.addEventListener('touchend', () => {
                joystick.active = false; joystick.x = 0; joystick.y = 0;
                document.getElementById('joystick-stick').style.transform = `translate(0,0)`;
                touchLookX = 0; touchLookY = 0;
            });
            document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
                e.preventDefault(); if(player.position.y <= 1.61) playerVelocityY = 0.22;
            });
        }

        // --- ゲーム管理 ---
        window.startGame = function() {
            if (isStarted && !isMobile) {
                renderer.domElement.requestPointerLock();
                return;
            }
            hp = 100; score = 0; isStarted = true;
            document.getElementById('msg').style.display = 'none';
            if(!isMobile) renderer.domElement.requestPointerLock();
            
            enemies.forEach(e => scene.remove(e));
            enemies.length = 0;
            for(let i=0; i<6; i++) spawnEnemy();
        }

        document.addEventListener('pointerlockchange', () => {
            if(!isMobile) document.getElementById('msg').style.display = document.pointerLockElement ? 'none' : 'flex';
        });

        function spawnEnemy() {
            const drone = new THREE.Group();
            drone.add(new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshPhongMaterial({color: 0xff0000})));
            const a = Math.random() * Math.PI * 2;
            const d = 25 + Math.random() * 15;
            drone.position.set(Math.cos(a)*d, 2.0, Math.sin(a)*d);
            drone.lastShoot = Date.now() + Math.random() * 2000;
            scene.add(drone); enemies.push(drone);
        }

        function fire() {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({color: 0x00ffff}));
            const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
            b.position.copy(player.position);
            b.velocity = dir.multiplyScalar(1.3);
            scene.add(b); playerBullets.push(b);
        }

        let lastAutoFire = 0;
        function animate() {
            requestAnimationFrame(animate);
            if (!isStarted) return;

            // PC操作の移動
            if(!isMobile) {
                if(keys['KeyW']) player.translateZ(-0.12);
                if(keys['KeyS']) player.translateZ(0.12);
                if(keys['KeyA']) player.translateX(-0.12);
                if(keys['KeyD']) player.translateX(0.12);
                if(keys['Space'] && player.position.y <= 1.61) playerVelocityY = 0.22;
            } else {
                // スマホ移動
                player.translateZ(joystick.y * 0.12);
                player.translateX(joystick.x * 0.12);
                // スマホは自動射撃
                if(Date.now() - lastAutoFire > 800) { fire(); lastAutoFire = Date.now(); }
            }

            // 共通物理
            playerVelocityY -= 0.01;
            player.position.y += playerVelocityY;
            if(player.position.y < 1.6) { player.position.y = 1.6; playerVelocityY = 0; }

            // 敵の挙動
            const now = Date.now();
            enemies.forEach(e => {
                const toP = new THREE.Vector3().subVectors(player.position, e.position);
                if(toP.length() > 10) e.position.add(toP.normalize().multiplyScalar(0.02));
                if(now - e.lastShoot > 4000) {
                    const eb = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: 0xff8800}));
                    eb.position.copy(e.position);
                    eb.velocity = toP.normalize().multiplyScalar(0.18);
                    scene.add(eb); enemyBullets.push(eb);
                    e.lastShoot = now;
                }
            });

            // 衝突判定
            [...enemyBullets].forEach((b, i) => {
                b.position.add(b.velocity);
                if(b.position.distanceTo(player.position) < 0.8) {
                    hp -= 20; scene.remove(b); enemyBullets.splice(i, 1);
                    document.getElementById('hp-bar').style.width = hp + '%';
                    if(hp <= 0) { isStarted = false; location.reload(); }
                }
            });

            [...playerBullets].forEach((b, i) => {
                b.position.add(b.velocity);
                enemies.forEach((e, ei) => {
                    if(b.position.distanceTo(e.position) < 1.0) {
                        scene.remove(e); enemies.splice(ei, 1);
                        scene.remove(b); playerBullets.splice(i, 1);
                        score++; document.getElementById('score').innerText = score;
                        spawnEnemy();
                    }
                });
            });

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
