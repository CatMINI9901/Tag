<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D FPS - Balanced Mode</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #0f0;
            font-size: 18px; pointer-events: none; text-shadow: 2px 2px 2px #000;
        }
        #hp-bar-container { width: 200px; height: 10px; background: #333; margin-top: 5px; border: 1px solid #0f0; }
        #hp-bar { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #weapon-info { margin-top: 10px; font-weight: bold; }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 16px; height: 16px; border: 2px solid #0f0;
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #0f0; font-size: 30px; text-align: center; cursor: pointer;
            background: rgba(0,20,0,0.9); padding: 40px; border: 2px solid #0f0; z-index: 100;
        }
    </style>
</head>
<body>
    <div id="ui">
        SCORE: <span id="score">0</span> / 20<br>
        HEALTH
        <div id="hp-bar-container"><div id="hp-bar"></div></div>
        <div id="weapon-info">WEAPON: <span id="weapon-name">PISTOL</span></div>
        <div id="hint" style="font-size: 12px; color: #8f8; margin-top: 5px;">敵を倒すとたまに回復が出るよ！</div>
    </div>
    <div id="crosshair"></div>
    <div id="msg">CLICK TO START</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let score = 0, hp = 100, isGameOver = true;
        const enemies = [], bullets = [], walls = [], items = [];
        let currentWp = 1, lastFire = 0;
        const weapons = {
            1: { name: "PISTOL", rate: 300, count: 1, spread: 0, speed: 1.5 },
            2: { name: "SHOTGUN", rate: 700, count: 10, spread: 0.2, speed: 1.2 },
            3: { name: "MACHINE GUN", rate: 70, count: 1, spread: 0.08, speed: 1.8 }
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 1, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x888888));
        const sunLight = new THREE.DirectionalLight(0xaaaaff, 0.5);
        sunLight.position.set(20, 50, 20);
        scene.add(sunLight);

        // 地面
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhongMaterial({color: 0x111111}));
        plane.rotation.x = -Math.PI/2;
        scene.add(plane);
        scene.add(new THREE.GridHelper(100, 50, 0x00ff00, 0x333333));

        // 壁
        const wallGeo = new THREE.BoxGeometry(4, 5, 4);
        const wallMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        for(let i=0; i<30; i++) {
            const w = new THREE.Mesh(wallGeo, wallMat);
            const a = Math.random() * Math.PI * 2;
            const d = 15 + Math.random() * 35;
            w.position.set(Math.cos(a)*d, 2.5, Math.sin(a)*d);
            scene.add(w); walls.push(w);
        }

        const player = new THREE.Group();
        scene.add(player);
        player.add(camera);

        const keys = {};
        const msg = document.getElementById('msg');

        function resetGame() {
            score = 0; hp = 100; isGameOver = false;
            document.getElementById('score').innerText = score;
            updateHPDisplay();
            enemies.forEach(e => scene.remove(e));
            bullets.forEach(b => scene.remove(b));
            items.forEach(it => scene.remove(it));
            enemies.length = 0; bullets.length = 0; items.length = 0;
            player.position.set(0, 1.6, 0);
            for(let i=0; i<20; i++) spawnEnemy();
        }

        function spawnEnemy() {
            const e = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 1.2), new THREE.MeshPhongMaterial({color: 0xff4444, emissive: 0x220000}));
            const angle = Math.random() * Math.PI * 2;
            const dist = 30 + Math.random() * 20; 
            e.position.set(Math.cos(angle)*dist, 1.1, Math.sin(angle)*dist);
            e.isStunned = 0;
            scene.add(e);
            enemies.push(e);
        }

        function spawnItem(pos) {
            if(Math.random() > 0.4) return; // 40%の確率でドロップ
            const item = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({color: 0x00ff00, emissive: 0x004400}));
            item.position.set(pos.x, 0.5, pos.z);
            scene.add(item);
            items.push(item);
        }

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                player.rotation.y -= e.movementX * 0.002;
                camera.rotation.x -= e.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, camera.rotation.x));
            }
        });

        document.addEventListener('keydown', e => { 
            keys[e.code] = true;
            if(e.key === "1") switchW(1); if(e.key === "2") switchW(2); if(e.key === "3") switchW(3);
        });
        document.addEventListener('keyup', e => keys[e.code] = false);
        msg.addEventListener('click', () => { if(isGameOver) resetGame(); renderer.domElement.requestPointerLock(); });

        document.addEventListener('pointerlockchange', () => {
            msg.style.display = document.pointerLockElement === renderer.domElement ? 'none' : 'block';
        });

        document.addEventListener('mousedown', () => {
            if (document.pointerLockElement === renderer.domElement && !isGameOver) {
                const now = Date.now();
                if(now - lastFire > weapons[currentWp].rate) {
                    const wp = weapons[currentWp];
                    const dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
                    for(let i=0; i<wp.count; i++) {
                        const b = new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({color: 0x00ffff}));
                        b.position.copy(player.position);
                        const bDir = dir.clone();
                        bDir.x += (Math.random()-0.5)*wp.spread; bDir.y += (Math.random()-0.5)*wp.spread;
                        b.velocity = bDir.normalize().multiplyScalar(wp.speed);
                        scene.add(b); bullets.push(b);
                    }
                    lastFire = now;
                }
            }
        });

        function switchW(id) { currentWp = id; document.getElementById('weapon-name').innerText = weapons[id].name; }

        function updateHPDisplay() {
            document.getElementById('hp-bar').style.width = Math.max(0, hp) + '%';
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isGameOver && document.pointerLockElement === renderer.domElement) {
                const isCrouch = keys['ShiftLeft'] || keys['ShiftRight'];
                const speed = isCrouch ? 0.08 : 0.16;
                const targetY = isCrouch ? 0.9 : 1.6;
                player.position.y += (targetY - player.position.y) * 0.15;

                const oldPos = player.position.clone();
                if(keys['KeyW']) player.translateZ(-speed);
                if(keys['KeyS']) player.translateZ(speed);
                if(keys['KeyA']) player.translateX(-speed);
                if(keys['KeyD']) player.translateX(speed);
                
                walls.forEach(w => {
                    if(Math.abs(player.position.x - w.position.x) < 2.5 && Math.abs(player.position.z - w.position.z) < 2.5) player.position.copy(oldPos);
                });

                // 敵の挙動
                enemies.forEach(e => {
                    if (Date.now() < e.isStunned) return; // 被弾後のスタン
                    const toP = new THREE.Vector3().subVectors(player.position, e.position);
                    e.position.add(toP.normalize().multiplyScalar(0.025)); // 速度を半分に
                    if(toP.length() < 1.3) {
                        hp -= 0.3; // ダメージを大幅に軽減
                        updateHPDisplay();
                        if(hp <= 0) {
                            isGameOver = true;
                            msg.innerHTML = "GAME OVER<br><span style='font-size:16px'>CLICK TO RESTART</span>";
                            document.exitPointerLock();
                        }
                    }
                });

                // 回復アイテム判定
                items.forEach((it, idx) => {
                    it.rotation.y += 0.05;
                    if(player.position.distanceTo(it.position) < 1.5) {
                        hp = Math.min(100, hp + 20);
                        updateHPDisplay();
                        scene.remove(it);
                        items.splice(idx, 1);
                    }
                });

                // 弾の判定
                for(let i=bullets.length-1; i>=0; i--) {
                    const b = bullets[i]; b.position.add(b.velocity);
                    let removed = false;
                    enemies.forEach((e, ei) => {
                        if(!removed && b.position.distanceTo(e.position) < 1.3) {
                            e.isStunned = Date.now() + 200; // 0.2秒間足止め
                            scene.remove(b); bullets.splice(i, 1);
                            removed = true;
                            // 敵消去の判定（体力制にせず1撃で倒せるように維持）
                            spawnItem(e.position);
                            scene.remove(e); enemies.splice(ei, 1);
                            score++; document.getElementById('score').innerText = score;
                            if(score >= 20) {
                                isGameOver = true;
                                msg.innerHTML = "MISSION COMPLETE!<br><span style='font-size:16px'>YOU ARE THE SURVIVOR</span>";
                                document.exitPointerLock();
                            }
                        }
                    });
                    if(!removed && b.position.length() > 100) { scene.remove(b); bullets.splice(i, 1); }
                }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
